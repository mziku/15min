<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>15 Minute Call</title>

    <style>
        html, body {
            margin: 0;
            height: 100%;
            font-family: Arial, sans-serif;
            background: #111;
        }

        #timer-bar {
            height: 60px;
            background: white;
            color: black;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        #meet {
            height: calc(100vh - 60px);
        }
    </style>
</head>

<body>

<div id="timer-bar">
    Call limit: <span id="timer">&nbsp;15:00</span>
</div>

<div id="meet"></div>

<script src="https://meet.jit.si/external_api.js"></script>

<script>
    const CALL_LENGTH = 15 * 60; // 15 minutes in seconds

    const params = new URLSearchParams(window.location.search);

    let roomName = params.get("room");

    // If no room is specified, create a random one
    if (!roomName) {
        roomName =
            "TimedCall-" +
            crypto.randomUUID().replaceAll("-", "");

        const newURL =
            window.location.pathname +
            "?room=" +
            roomName;

        history.replaceState(null, "", newURL);
    }

    const domain = "meet.jit.si";

    const options = {
        roomName: roomName,
        width: "100%",
        height: "100%",
        parentNode: document.querySelector("#meet")
    };

    const api = new JitsiMeetExternalAPI(domain, options);

    let deadline = null;
    let interval = null;
    let ended = false;

    function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;

        return (
            String(minutes).padStart(2, "0") +
            ":" +
            String(secs).padStart(2, "0")
        );
    }

    function endCall() {

        if (ended) return;

        ended = true;

        document.getElementById("timer").textContent = "00:00";

        /*
         Try to terminate the entire conference.
         This works if this participant is moderator
         and the deployment supports endConference.
        */
        api.executeCommand("endConference");

        /*
         Even if endConference is unavailable,
         definitely disconnect this participant.
        */
        setTimeout(() => {
            api.executeCommand("hangup");
        }, 500);
    }

    function updateTimer() {

        const remaining =
            Math.ceil((deadline - Date.now()) / 1000);

        if (remaining <= 0) {

            document.getElementById("timer").textContent =
                "00:00 — CALL ENDED";

            clearInterval(interval);

            endCall();

            return;
        }

        document.getElementById("timer").textContent =
            formatTime(remaining);
    }

    /*
     Jitsi reports when the conference itself
     was created. That gives everyone the same
     reference time.
    */
    api.addEventListener(
        "conferenceCreatedTimestamp",
        event => {

            let created = event.timestamp;

            // Normalize seconds vs milliseconds
            if (created < 1000000000000) {
                created *= 1000;
            }

            deadline =
                created + CALL_LENGTH * 1000;

            updateTimer();

            interval =
                setInterval(updateTimer, 250);

            // Also display Jitsi's own meeting timer
            const alreadyElapsed =
                Math.floor(
                    (Date.now() - created) / 1000
                );

            api.executeCommand(
                "setMeetingTimer",
                {
                    duration: CALL_LENGTH,
                    elapsed: alreadyElapsed
                }
            );
        }
    );
</script>

</body>
</html>
