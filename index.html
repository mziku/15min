<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>15 Minute Call</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    padding-top: 80px;
}

#timer {
    font-size: 70px;
    font-weight: bold;
    margin: 30px;
}

button {
    font-size: 20px;
    padding: 15px 30px;
    cursor: pointer;
}
</style>
</head>

<body>

<h1>15 Minute Call</h1>

<div id="timer">15:00</div>

<button id="start">Start 15-minute call</button>

<p id="status"></p>

<script>

const params = new URLSearchParams(window.location.search);

let room = params.get("room");

if (!room) {
    room = "15min-" + crypto.randomUUID();

    const url =
        window.location.pathname +
        "?room=" +
        encodeURIComponent(room);

    history.replaceState({}, "", url);
}

let callWindow;
let timerInterval;

document.getElementById("start").onclick = function () {

    // Open a NORMAL Jitsi meeting, not an embedded one
    callWindow = window.open(
        "https://meet.jit.si/" + encodeURIComponent(room),
        "jitsiCall"
    );

    const endTime = Date.now() + (15 * 60 * 1000);

    document.getElementById("start").disabled = true;

    timerInterval = setInterval(function () {

        const remaining = endTime - Date.now();

        if (remaining <= 0) {

            clearInterval(timerInterval);

            document.getElementById("timer").textContent = "00:00";
            document.getElementById("status").textContent =
                "Call ended.";

            // HARD CUTOFF
            if (callWindow && !callWindow.closed) {
                callWindow.close();
            }

            return;
        }

        const seconds = Math.ceil(remaining / 1000);

        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;

        document.getElementById("timer").textContent =
            String(minutes).padStart(2, "0")
            + ":" +
            String(secs).padStart(2, "0");

    }, 250);
};

</script>

</body>
</html>
